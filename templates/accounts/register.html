{% extends 'base.html' %}
{% load static %}
{% block title %}Register – LuxeStore{% endblock %}

{% block content %}
<div class="auth-page" id="registerPage">
  <div class="auth-card">

    <!-- Logo -->
    <a href="/" class="auth-logo" id="authLogo" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit;">
      <span class="auth-logo-icon logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" fill="#E91E8C"/>
        </svg>
      </span>
      Luxe<span style="color:var(--brand);font-weight:400;">Store</span>
    </a>
    <p class="auth-subtitle">Create your account to start shopping</p>

    <form id="registerForm" onsubmit="handleRegister(event)">
      {% csrf_token %}

      <!-- Full Name -->
      <div>
        <label class="auth-label" for="registerName">Full Name</label>
        <div class="auth-input-wrap">
          <i class="far fa-user auth-input-icon"></i>
          <input class="auth-input" type="text" id="registerName" placeholder="Enter your name" required/>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="auth-label" for="registerEmail">Email</label>
        <div class="auth-input-wrap">
          <i class="far fa-envelope auth-input-icon"></i>
          <input class="auth-input" type="email" id="registerEmail" placeholder="Enter your email" required/>
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="auth-label" for="registerPassword">Password</label>
        <div class="auth-input-wrap">
          <i class="fas fa-lock auth-input-icon"></i>
          <input class="auth-input" type="password" id="registerPassword" placeholder="Enter your password" required/>
        </div>
      </div>

      <!-- Show Password -->
      <label class="auth-show-pass">
        <input type="checkbox" id="showRegPasswordCheck" onchange="togglePasswordVisibility('registerPassword', this)"/>
        Show Password
      </label>

      <!-- Error message -->
      <div id="registerError" style="color:#ef4444;font-size:.82rem;margin-bottom:12px;text-align:center;display:none;"></div>

      <!-- Submit -->
      <button type="submit" class="btn-auth btn-auth-brand" id="registerBtn">Register</button>
    </form>

    <!-- Switch to Login -->
    <div class="auth-switch">
      Already have an account? <a href="/accounts/login/" id="goToLogin">Login</a>
    </div>

<script>
function togglePasswordVisibility(inputId, checkbox) {
  const input = document.getElementById(inputId);
  input.type = checkbox.checked ? 'text' : 'password';
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  const errEl = document.getElementById('registerError');
  errEl.style.display = 'none';
  btn.textContent = 'Creating account...';
  btn.disabled = true;

  const fullName = document.getElementById('registerName').value.trim();
  const email = document.getElementById('registerEmail').value.trim();
  const password = document.getElementById('registerPassword').value;
  const nameParts = fullName.split(' ');
  const firstName = nameParts[0] || '';
  const lastName = nameParts.slice(1).join(' ') || '';

  try {
    const resp = await fetch('/accounts/api/register/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
      body: JSON.stringify({
        username: email,
        email: email,
        password: password,
        first_name: firstName,
        last_name: lastName
      })
    });
    const data = await resp.json();
    if (resp.ok) {
      showToast('Account created! Welcome to LuxeStore 🎉', 'success');
      setTimeout(() => spaNavigate('/'), 800);
    } else {
      const errors = Object.values(data).flat().join(' ');
      errEl.textContent = errors || 'Registration failed';
      errEl.style.display = 'block';
      btn.textContent = 'Register';
      btn.disabled = false;
    }
  } catch(err) {
    errEl.textContent = 'Something went wrong. Please try again.';
    errEl.style.display = 'block';
    btn.textContent = 'Register';
    btn.disabled = false;
  }
}
</script>
  </div>
</div>
{% endblock %}
